<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CineWave</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .auth-container { max-width: 450px; margin: 8rem auto; padding: 3rem; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; color: var(--text-muted); font-size: 0.9rem; }
        input { width: 100%; padding: 1rem; border-radius: 12px; border: 1px solid var(--glass-border); background: rgba(255, 255, 255, 0.05); color: white; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--primary); background: rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body>
    <div class="auth-container glass animate">
        <h2 style="text-align: center; margin-bottom: 2rem; font-size: 2rem;">Welcome Back</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>Username / Email</label>
                <input type="text" id="loginId" placeholder="Enter username or email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem; margin-top: 1rem;">Login</button>
            <p style="text-align: center; margin-top: 1.5rem; color: var(--text-muted); font-size: 0.9rem;">Don't have an account? <a href="register.html" style="color: var(--primary); text-decoration: none;">Sign Up</a></p>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const username = document.getElementById('loginId').value.trim();
            const password = e.target.querySelector('input[type="password"]').value;
            const btn = e.target.querySelector('button[type="submit"]');
            btn.textContent = 'Logging in...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/users/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (!res.ok) {
                    alert(data.error || 'Login failed.');
                    btn.textContent = 'Login';
                    btn.disabled = false;
                    return;
                }
                localStorage.setItem('role', data.role);
                localStorage.setItem('userName', data.name || data.username);
                if (data.role === 'admin') {
                    location.href = 'admin.html';
                } else {
                    location.href = 'dashboard.html';
                }
            } catch(err) {
                alert('Could not connect to server. Make sure the backend is running.');
                btn.textContent = 'Login';
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
