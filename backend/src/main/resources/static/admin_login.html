<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | CineWave</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .login-container { height: 100vh; display: flex; justify-content: center; align-items: center; }
        .login-card { width: 100%; max-width: 400px; padding: 3rem; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card glass animate">
            <h1 style="text-align: center; margin-bottom: 0.5rem; color: var(--secondary);">ADMIN PORTAL</h1>
            <p style="text-align: center; margin-bottom: 2.5rem; color: var(--text-muted); font-size: 0.9rem;">Restricted Access - Authorized Personnel Only</p>
            
            <form id="adminLoginForm">
                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label style="font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted);">Admin Username</label>
                    <input type="text" id="adminUser" placeholder="Enter username" required style="width: 100%; padding: 0.8rem; margin-top: 0.5rem; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 8px; color: white;">
                </div>
                <div class="form-group" style="margin-bottom: 2rem;">
                    <label style="font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted);">Admin Password</label>
                    <input type="password" id="adminPass" placeholder="Enter password" required style="width: 100%; padding: 0.8rem; margin-top: 0.5rem; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 8px; color: white;">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem; font-weight: 600;">Secure Login</button>
            </form>
            
            <p id="errorMsg" style="color: var(--danger); text-align: center; margin-top: 1.5rem; font-size: 0.8rem; display: none;">Invalid credentials. Please try again.</p>
            
            <div style="text-align: center; margin-top: 2rem;">
                <a href="index.html" style="color: var(--text-muted); text-decoration: none; font-size: 0.8rem;">&larr; Back to Main Site</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('adminLoginForm').onsubmit = (e) => {
            e.preventDefault();
            const user = document.getElementById('adminUser').value;
            const pass = document.getElementById('adminPass').value;

            if (user === 'Admin' && pass === 'admin123') {
                localStorage.setItem('role', 'admin');
                alert('Access Granted. Redirecting to Management Console...');
                location.href = 'admin.html';
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        };
    </script>
</body>
</html>
