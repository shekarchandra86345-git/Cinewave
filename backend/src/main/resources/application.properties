spring.application.name=online-ticket-booking
# Use DATABASE_URL from environment if available, otherwise default to H2 file DB
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/ticketdb}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# Let hibernate auto-detect the dialect based on the database
spring.jpa.database-platform=${DB_DIALECT:}
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
